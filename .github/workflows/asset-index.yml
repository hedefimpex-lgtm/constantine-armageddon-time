name: Harita ve karakter incelemesi
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/asset-index.yml', 'scripts/index-assets.py', 'scripts/probe-zone-object.py', 'scripts/original_assets.py', 'scripts/check-original-export.py']
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum okuyucusunu hazırla
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install innoextract
      - name: Doğrulanmış kurulumu indir ve aç
        run: |
          installer="$RUNNER_TEMP/istanbulkur6_0.exe"
          python3 scripts/fetch-installer.py "$installer"
          echo "6fcfaaf85872fd7b88ca9eecef3d865e595ebc48a879fe9a6369812e440411c8  $installer" | sha256sum -c -
          mkdir -p build/asset-index "$RUNNER_TEMP/ikv"
          innoextract --silent --extract --output-dir "$RUNNER_TEMP/ikv" "$installer"
      - name: Kaynak kayıtlarını ve istemci referanslarını incele
        run: |
          python3 scripts/index-assets.py "$RUNNER_TEMP/ikv" build/asset-index/assets.json
          python3 scripts/probe-zone-object.py "$RUNNER_TEMP/ikv" build/asset-index/zone-object.json
      - name: Orijinal arazi ve arşiv üyesi dışa aktarımını doğrula
        run: python3 scripts/check-original-export.py "$RUNNER_TEMP/ikv/app/base" build/asset-index/export.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ikv-asset-index
          path: build/asset-index/*.json
          retention-days: 14
