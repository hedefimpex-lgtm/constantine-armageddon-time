<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>zone00 · Arazi incelemesi</title>
<style>
*{box-sizing:border-box}html,body,main,canvas{width:100%;height:100%;margin:0}body{background:#132127;color:#eee9ce;font-family:system-ui,sans-serif}main{position:relative}canvas{display:block;touch-action:none}.heading,.controls{position:absolute;left:16px;right:16px;display:flex;align-items:center;pointer-events:none}.heading{top:18px;justify-content:space-between;align-items:flex-start}.heading h1{font:normal 28px Georgia,serif;margin:0}.heading p{margin:2px 0;color:#c2d3cc;font-size:13px}.controls{bottom:18px;justify-content:flex-end;gap:7px}.controls button{pointer-events:auto;font:600 15px system-ui,sans-serif;min-height:44px;min-width:44px;background:#213337;color:#f0ebd3;border:1px solid #608078;border-radius:5px;padding:8px 12px}.controls button:focus{outline:2px solid #ebcb78}.tip{position:absolute;left:16px;bottom:66px;color:#d2e0d9;font-size:12px;margin:0;pointer-events:none}
</style></head>
<body><main><canvas id="terrain" aria-label="Orijinal zone00 yüksekliklerinden çizilen üç boyutlu arazi"></canvas><header class="heading"><div><h1>zone00</h1><p>Orijinal arazi yükseklikleri</p></div></header>
<p class="tip">Döndürmek için sürükle.</p><div class="controls"><button id="out" aria-label="Uzaklaştır">−</button><button id="in" aria-label="Yaklaştır">+</button><button id="reset">İlk görünüm</button></div></main>
<script id="mesh" type="application/json">__ZONE_MESH__</script><script>
"use strict";
const mesh=JSON.parse(document.getElementById("mesh").textContent);
const canvas=document.getElementById("terrain"),ctx=canvas.getContext("2d");
const v=mesh.vertices,faces=mesh.triangles;
const xs=v.map(p=>p[0]),ys=v.map(p=>p[1]),zs=v.map(p=>p[2]);
const bounds=values=>values.reduce(([min,max],x)=>[Math.min(min,x),Math.max(max,x)],[Infinity,-Infinity]);
const [x0,x1]=bounds(xs),[y0,y1]=bounds(ys),[z0,z1]=bounds(zs);
const center=[(x0+x1)/2,(y0+y1)/2,(z0+z1)/2];
const geometry=v.map(p=>p.map((x,i)=>x-center[i]));
const shades=faces.map(([i,j,k])=>{
 const a=v[i],b=v[j],c=v[k],dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2],ex=c[0]-a[0],ey=c[1]-a[1],ez=c[2]-a[2];
 const nx=dy*ez-dz*ey,ny=dz*ex-dx*ez,nz=dx*ey-dy*ex,n=Math.hypot(nx,ny,nz)||1;
 const light=Math.max(0,(-.46*nx+.72*ny-.52*nz)/n),h=(a[1]+b[1]+c[1]-3*y0)/(3*(y1-y0||1));
 return "rgb("+[48+105*light+54*h,71+101*light+32*h,67+79*light+23*h].map(Math.round).join(",")+")";
});
let yaw,pitch,zoom,drag;
function reset(){yaw=-.66;pitch=.72;zoom=1;draw()}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#132127";ctx.fillRect(0,0,w,h);
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const projected=geometry.map(([x,y,z])=>{const a=x*cy-z*sy,b=x*sy+z*cy;return [a,y*cp-b*sp,b*cp+y*sp]});
 const [u0,u1]=bounds(projected.map(p=>p[0])),[v0,v1]=bounds(projected.map(p=>p[1]));
 const scale=zoom*Math.min((w*.92)/Math.max(1,u1-u0),Math.max(70,h-175)/Math.max(1,v1-v0));
 const ox=w*.5-(u0+u1)*scale*.5,oy=h*.5+(v0+v1)*scale*.5;
 const depth=faces.map(([i,j,k],f)=>[projected[i][2]+projected[j][2]+projected[k][2],f]).sort((a,b)=>a[0]-b[0]);
 for(const [,f] of depth){
  ctx.fillStyle=ctx.strokeStyle=shades[f];ctx.lineWidth=.55;ctx.beginPath();
  faces[f].forEach((index,n)=>{const p=projected[index],x=ox+p[0]*scale,y=oy-p[1]*scale;if(n)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
  ctx.closePath();ctx.fill();ctx.stroke();
 }
}
canvas.addEventListener("pointerdown",e=>{if(drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;yaw+=(e.clientX-drag.x)*.009;pitch=Math.max(.10,Math.min(1.48,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;draw()});
canvas.addEventListener("lostpointercapture",()=>{drag=null});
document.getElementById("in").onclick=()=>{zoom=Math.min(4,zoom*1.25);draw()};
document.getElementById("out").onclick=()=>{zoom=Math.max(.55,zoom/1.25);draw()};
document.getElementById("reset").onclick=reset;
window.addEventListener("resize",draw);reset();
</script></body></html>
