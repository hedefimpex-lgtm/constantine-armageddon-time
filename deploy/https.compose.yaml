services:
  gateway:
    image: caddy:2-alpine
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN to your game hostname}
    ports:
      - "${GAME_HTTP_PORT:-80}:80"
      - "${GAME_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      game:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
